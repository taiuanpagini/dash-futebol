openapi: "3.0.3"
info:
  title: Fixtures API (atualizado)
  version: "2.0"
  description: Endpoints de partidas com filtro por temporada

paths:
  /api/fixtures:
    get:
      summary: Lista todas as partidas
      operationId: listFixtures
      tags: [fixtures]
      parameters:
        - $ref: "#/components/parameters/SeasonQuery"
      responses:
        "200":
          description: Lista de partidas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FixtureDto"

  /api/fixtures/team/{teamId}/matchweeks:
    get:
      summary: Dados por rodada de um time na temporada
      operationId: getTeamMatchweeks
      tags: [fixtures]
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/SeasonQuery"
      responses:
        "200":
          description: Estatísticas por rodada do time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchweekDataDto"
              example:
                - matchweek: 1
                  goalsScored: 2
                  goalsConceded: 0
                  possession: 62.5
                  shots: 18
                  shotsOnTarget: 8
                  passes: 531
                  passAccuracy: 88.0
                  result: W
                  opponent: "Man City"
                  opponentColor: "#6CABDD"
                  homeAway: H
        "404":
          description: Time não encontrado

components:
  parameters:
    SeasonQuery:
      name: season
      in: query
      required: false
      schema:
        type: string
        pattern: '^\d{4}$'
      description: >
        Ano de início da temporada (ex: "2024" = 2024/25).
        Omitido = temporada mais recente no banco.
      example: "2024"

  schemas:
    FixtureDto:
      type: object
      required: [id, matchweek, date, homeTeam, awayTeam, homeGoals, awayGoals, played, season]
      properties:
        id: { type: integer }
        matchweek: { type: integer }
        date: { type: string, format: date }
        season: { type: string, example: "2024" }
        homeTeam:
          $ref: "#/components/schemas/TeamRef"
        awayTeam:
          $ref: "#/components/schemas/TeamRef"
        homeGoals: { type: integer }
        awayGoals: { type: integer }
        played: { type: boolean }
        homeStats:
          $ref: "#/components/schemas/MatchStatsDto"
        awayStats:
          $ref: "#/components/schemas/MatchStatsDto"

    MatchweekDataDto:
      type: object
      required: [matchweek, goalsScored, goalsConceded, possession, shots, shotsOnTarget, passes, passAccuracy, result, opponent, opponentColor, homeAway]
      properties:
        matchweek: { type: integer }
        goalsScored: { type: integer }
        goalsConceded: { type: integer }
        possession: { type: number }
        shots: { type: integer }
        shotsOnTarget: { type: integer }
        passes: { type: integer }
        passAccuracy: { type: number }
        result:
          type: string
          enum: [W, D, L]
        opponent: { type: string }
        opponentColor: { type: string }
        homeAway:
          type: string
          enum: [H, A]

    MatchStatsDto:
      type: object
      properties:
        teamId: { type: integer }
        possession: { type: number }
        shots: { type: integer }
        shotsOnTarget: { type: integer }
        passes: { type: integer }
        passAccuracy: { type: number }
        fouls: { type: integer }
        yellowCards: { type: integer }
        redCards: { type: integer }
        corners: { type: integer }
        offsides: { type: integer }

    TeamRef:
      type: object
      required: [id, name, primaryColor]
      properties:
        id: { type: integer }
        name: { type: string }
        primaryColor: { type: string }
        logoUrl: { type: string, nullable: true }
