openapi: "3.0.3"
info:
  title: Players API (atualizado)
  version: "2.0"
  description: Endpoints de jogadores com filtro por temporada

paths:
  /api/players/team/{teamId}:
    get:
      summary: Lista jogadores de um time (artilheiros/garçons da temporada)
      operationId: getPlayersByTeam
      tags: [players]
      parameters:
        - name: teamId
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/SeasonQuery"
      responses:
        "200":
          description: Lista de jogadores do time com stats da temporada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerWithStatsDto"

  /api/players/top-scorers:
    get:
      summary: Artilheiros da temporada
      operationId: getTopScorers
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/SeasonQuery"
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Top artilheiros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerWithStatsDto"

  /api/players/top-assists:
    get:
      summary: Maiores assistentes da temporada
      operationId: getTopAssists
      tags: [players]
      parameters:
        - $ref: "#/components/parameters/SeasonQuery"
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: Top assistentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerWithStatsDto"

  /api/players/{id}:
    get:
      summary: Busca um jogador por ID
      operationId: getPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Dados do jogador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerDto"
        "404":
          description: Jogador não encontrado

  /api/players/{id}/stats:
    get:
      summary: Estatísticas de um jogador por temporada
      operationId: getPlayerStats
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/SeasonQuery"
      responses:
        "200":
          description: Stats do jogador na temporada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsDetailDto"
        "404":
          description: Jogador não encontrado

components:
  parameters:
    SeasonQuery:
      name: season
      in: query
      required: false
      schema:
        type: string
        pattern: '^\d{4}$'
      description: >
        Ano de início da temporada (ex: "2024" = 2024/25).
        Omitido = temporada mais recente no banco.
      example: "2024"

  schemas:
    PlayerDto:
      type: object
      required: [id, name, position, age, nationality, number]
      properties:
        id: { type: integer }
        name: { type: string }
        position:
          type: string
          enum: [GK, DEF, MID, FWD]
        age: { type: integer }
        nationality: { type: string }
        number: { type: integer }
        photoUrl: { type: string, nullable: true }
        teamId: { type: integer }
        teamName: { type: string }
        teamColor: { type: string }

    PlayerSeasonStatsDto:
      type: object
      required: [season, goals, assists]
      properties:
        season: { type: string, example: "2024" }
        goals: { type: integer }
        assists: { type: integer }
        appearances: { type: integer }
        minutesPlayed: { type: integer, nullable: true }
        averageRating: { type: number, nullable: true }

    PlayerWithStatsDto:
      allOf:
        - $ref: "#/components/schemas/PlayerDto"
        - type: object
          properties:
            stats:
              $ref: "#/components/schemas/PlayerSeasonStatsDto"
            totalGoals: { type: integer }
            totalAssists: { type: integer }
            averageRating: { type: number }

    PlayerStatsDetailDto:
      type: object
      required: [player, seasonStats]
      properties:
        player:
          $ref: "#/components/schemas/PlayerDto"
        seasonStats:
          $ref: "#/components/schemas/PlayerSeasonStatsDto"
